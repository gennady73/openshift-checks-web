                            <span id="relativeTimeFilterArea">
                                <select class="selectpicker form-control input-medium" id="relativeTimeFilter"

                                        data-live-search="false"
                                        data-width="150px"
                                        data-size="10"
                                        aria-describedby="relativeTimeFilter"
                                        data-error="The value is empty!" data-minlength="6" required >
                                    <option value=""><span class="relative-time-field"></span>Filter by Time</option>
                                    <option value="5-minutes"><span class="relative-time-field"></span>Last 5 minutes</option>
                                    <option value="15-minutes"><span class="relative-time-field"></span>Last 15 minutes</option>

                        <label for="check-results-from">Compare From:

                            <span class="pficon pficon-info" data-toggle="tooltip" data-placement="top" title="" data-original-title="Select check result to compare from"></span>
                        </label>
                        <span class="spacer" style="margin-left: 10px;"></span>
                        <span id="check-results-from">
                            <select class="selectpicker form-control input-medium" id="check-results-from-select"
                                    title="Select check result"
                                    data-live-search="true"
                                    data-width="300px"
                                    data-size="10"
                                    aria-describedby="check-results-from"
                                    data-error="The value is empty!" data-minlength="6" required >
                                <option></option>
                            </select>
                        </span>
                        <span class="spacer" style="margin-left: 20px;"></span>
                        <label for="check-results-to"> To:
                            <!-- the help icon and tooltip -->
                            <span class="pficon pficon-info" data-toggle="tooltip" data-placement="top" title="" data-original-title="Select check result to compare to"></span>
                        </label>
                        <span class="spacer" style="margin-left: 10px;"></span>
                        <span id="check-results-to">
                            <select class="selectpicker form-control input-medium" id="check-results-to-select"
                                    title="Select check result"
                                    data-live-search="true"
                                    data-width="300px"
                                    data-size="10"
                                    aria-describedby="check-results-to"
                                    data-error="The value is empty!" data-minlength="6" required >

                                <option></option>
                            </select>
                        </span>
                        <span class="spacer" style="margin-left: 20px;"></span>
                        <label for="submit-diff-btn">
                        <!-- the help icon and tooltip -->
                        <span class="pficon pficon-info" data-toggle="tooltip" data-placement="top" title=""
                            data-original-title="Calculates and visualizes the configuration drift between the two selected snapshots."></span>
                        </label>
                        <span class="spacer" style="margin-left: 5px;"></span>
                        <button type="button" id="submit-diff-btn" onclick="showProcessing();" class="btn btn-primary">Run diff results</button>
                        <span id="loading-icon" class="loading-icon">

                <div id="notification" class="notification">
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            {% for message in messages %}
                                <div class="flash-{{ message[1] }}">{{ message }}</div>
                            {% endfor %}
